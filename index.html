<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/Yokai-admin-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Panel administrativo de Yokai.">
  <meta name="theme-color" content="#101217">
  <meta name="color-scheme" content="dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yokai Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Yokai Admin</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background-color: #101217;
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }
  </style>
</head>
<body>
  <script src="passkeys_bundle.js" type="application/javascript"></script>
  <script>
    window.yokaiIsStandalone = function () {
      return window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
    };

    window.yokaiRestoreInteractions = function () {
      if (!window.yokaiIsStandalone()) return;
      if (document.activeElement instanceof HTMLElement) {
        document.activeElement.blur();
      }
      requestAnimationFrame(function () {
        window.dispatchEvent(new Event('resize'));
      });
    };

    window.addEventListener('pageshow', window.yokaiRestoreInteractions);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        window.yokaiRestoreInteractions();
      }
    });

    window.yokaiPrepareStartup = async function () {
      if (!('serviceWorker' in navigator)) return true;
      const basePath = new URL(document.baseURI).pathname;
      const registrations = await navigator.serviceWorker.getRegistrations();
      const appRegistrations = registrations.filter(function (registration) {
        return new URL(registration.scope).pathname.startsWith(basePath);
      });
      const controlled = navigator.serviceWorker.controller !== null;
      await Promise.all(appRegistrations.map(function (registration) {
        return registration.unregister();
      }));
      const reloadKey = 'yokai-service-worker-cleanup';
      if (controlled && sessionStorage.getItem(reloadKey) !== 'done') {
        sessionStorage.setItem(reloadKey, 'done');
        window.location.reload();
        return false;
      }
      sessionStorage.removeItem(reloadKey);
      return true;
    };
  </script>
  <script>
    window.yokaiPrepareStartup().catch(function (error) {
      console.warn('No se pudo limpiar el caché anterior:', error);
      return true;
    }).then(function (ready) {
      if (!ready) return;
      const bootstrap = document.createElement('script');
      const buildVersion = "1112492165" /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */;
      bootstrap.src = 'flutter_bootstrap.js?v=' + buildVersion;
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    });
  </script>
</body>
</html>
