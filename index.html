<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/Yokai-admin-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Panel administrativo de Yokai.">
  <meta name="theme-color" content="#101217">
  <meta name="color-scheme" content="dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yokai Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Yokai Admin</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --yokai-background: #101217;
      --yokai-surface: #171a20;
      --yokai-accent: #ff4d32;
      --yokai-text: #f4e8e5;
      --yokai-muted: #8f9096;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background-color: var(--yokai-background);
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    html.yokai-standalone-app,
    html.yokai-standalone-app body {
      touch-action: manipulation;
    }

    #yokai-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      padding: max(24px, env(safe-area-inset-top)) 24px
        max(24px, env(safe-area-inset-bottom));
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 77, 50, .12), transparent 34%),
        var(--yokai-background);
      opacity: 1;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    #yokai-splash.yokai-splash--hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .yokai-splash__content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(82vw, 320px);
      text-align: center;
    }

    .yokai-splash__logo-shell {
      display: grid;
      place-items: center;
      width: 132px;
      height: 132px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 32px;
      background: var(--yokai-surface);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .32);
    }

    .yokai-splash__logo {
      width: 104px;
      height: 104px;
      object-fit: contain;
    }

    .yokai-splash__title {
      margin: 22px 0 4px;
      color: var(--yokai-text);
      font: 800 27px/1.1 Arial, sans-serif;
      letter-spacing: .18em;
      text-indent: .18em;
    }

    .yokai-splash__subtitle {
      margin: 0;
      color: var(--yokai-muted);
      font: 600 12px/1.5 Arial, sans-serif;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .yokai-splash__loader {
      width: 152px;
      height: 3px;
      margin-top: 30px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
    }

    .yokai-splash__loader::after {
      display: block;
      width: 48%;
      height: 100%;
      border-radius: inherit;
      background: var(--yokai-accent);
      content: '';
      animation: yokai-loading 1.15s ease-in-out infinite;
    }

    .yokai-splash__status {
      min-height: 18px;
      margin: 14px 0 0;
      color: var(--yokai-muted);
      font: 400 12px/1.5 Arial, sans-serif;
    }

    @keyframes yokai-loading {
      from { transform: translateX(-110%); }
      to { transform: translateX(220%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #yokai-splash { transition: none; }
      .yokai-splash__loader::after { animation-duration: 2.4s; }
    }
  </style>
</head>
<body>
  <div id="yokai-splash" role="status" aria-live="polite" aria-label="Cargando Yokai">
    <div class="yokai-splash__content">
      <div class="yokai-splash__logo-shell">
        <img
          class="yokai-splash__logo"
          src="icons/yokai-app-icon.png"
          alt=""
          width="104"
          height="104"
          fetchpriority="high"
        >
      </div>
      <h1 class="yokai-splash__title">YOKAI</h1>
      <p class="yokai-splash__subtitle">Centro de operaciones</p>
      <div class="yokai-splash__loader" aria-hidden="true"></div>
      <p id="yokai-splash-status" class="yokai-splash__status">Preparando tu sesión…</p>
    </div>
  </div>
  <script src="passkeys_bundle.js" type="application/javascript"></script>
  <script src="standalone_zoom.js"></script>
  <script>
    (function () {
      const splash = document.getElementById('yokai-splash');
      const status = document.getElementById('yokai-splash-status');
      let removed = false;

      function removeSplash() {
        if (removed || !splash) return;
        removed = true;
        splash.classList.add('yokai-splash--hidden');
        window.setTimeout(function () { splash.remove(); }, 240);
      }

      window.addEventListener('flutter-first-frame', removeSplash, { once: true });
      window.setTimeout(function () {
        if (!removed && status) status.textContent = 'La primera carga puede tomar unos segundos…';
      }, 6000);
    }());
  </script>
  <script src="ios_readiness.js"></script>
  <script>
    const bootstrap = document.createElement('script');
    const buildVersion = "3993615037" /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */;
    bootstrap.src = 'flutter_bootstrap.js?v=' + buildVersion;
    bootstrap.async = true;
    document.body.appendChild(bootstrap);
  </script>
</body>
</html>
